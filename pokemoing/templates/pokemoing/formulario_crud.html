
{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>
    <link rel="stylesheet" href="{% static 'pokemoing/estilos.css' %}">
</head>
<body>

    <main class="crud-form-section">

        <h1>{{ titulo }}</h1>
        <p>Completa la información de tu nuevo Pokémon.</p>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            {% for campo in formulario %}
                <div class="campo-formulario">

                    <label for="{{ campo.id_for_label }}">
                        {{ campo.label }}
                    </label>

                    {{ campo }}

                    {% if campo.errors %}
                        <p class="error">{{ campo.errors }}</p>
                    {% endif %}

                </div>
            {% endfor %}

            <button type="submit" class="btn-agregar">
                Guardar Pokémon
            </button>

            <a href="{% url volver_url %}">Cancelar</a>

        </form>

    </main>

</body>
</html>
